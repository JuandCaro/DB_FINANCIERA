<!DOCTYPE html>
<html lang="es" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../css/style.css">
<title>SAF – Registro de Trabajador</title>
<script src="../js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="view-register" style="min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;">

  <!-- Botón modo oscuro -->
  <div class="dark-toggle-fixed">
    <button class="icon-btn" onclick="toggleDark()" style="background:var(--card);border:1px solid var(--border);width:44px;height:44px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.1)">
      <svg id="dark-icon-register" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <div style="max-width:720px;width:100%;padding:40px 20px">
    <button class="register-back" onclick="window.location.href='../index.html'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al Inicio
    </button>
    <div class="register-card">
      <div class="register-header">
        <div class="register-header-blob"></div>
        <h2>Registro de Trabajador</h2>
        <p>SISTEMA DE ANÁLISIS FINANCIERO</p>
        <small>Únete a la plataforma para la gestión eficiente de activos y presupuestos corporativos.</small>
      </div>
      <div class="register-body">
        <form class="grid-2" onsubmit="doRegister(event)">
          <div class="form-group">
            <label class="form-label">Documento de Identidad (10)</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
              <input class="form-input" type="text" maxlength="10" placeholder="10XXXXXXXX" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Nombres y Apellidos</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="form-input" type="text" minlength="5" placeholder="Juan Alberto Pérez" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Correo Corporativo</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input class="form-input" type="email" placeholder="jperez@empresa.com" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono de Contacto</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.61 4.38 2 2 0 0 1 3.58 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input class="form-input" type="tel" placeholder="3000000000" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Cargo Operativo</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              <select class="form-input" style="appearance:none">
                <option>Analista Financiero</option>
                <option>Gestor de Proyectos</option>
                <option>Auditor Interno</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Dirección de Oficina / Base</label>
            <div class="input-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <input class="form-input" type="text" placeholder="Sede Principal, Torre B" required/>
            </div>
          </div>
          <div style="grid-column:1/-1">
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Latitud Georef.</label>
                <input class="form-input-plain" type="text" inputmode="decimal" pattern="-?[0-9]+(\.[0-9]*)?" placeholder="4.711"/>
              </div>
              <div class="form-group">
                <label class="form-label">Longitud Georef.</label>
                <input class="form-input-plain" type="text" inputmode="decimal" pattern="-?[0-9]+(\.[0-9]*)?" placeholder="-74.072"/>
              </div>
            </div>
          </div>
          <div style="grid-column:1/-1;padding-top:16px">
            <button type="submit" class="btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
              Finalizar Registro de Acceso
            </button>
          </div>
        </form>
      </div>
    </div>
    <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted)">
      ¿Problemas con el registro? Contacte a Soporte IT: <a href="/cdn-cgi/l/email-protection#7d0e120d120f09183d0e1c1b531412" style="color:var(--blue-600)"><span class="__cf_email__" data-cfemail="71021e011e030514310210175f181e">[email&#160;protected]</span></a>
    </p>
  </div>
</div>

<script>
function doRegister(e) {
  e.preventDefault();
  window.location.href = '../index.html';
}
</script>
